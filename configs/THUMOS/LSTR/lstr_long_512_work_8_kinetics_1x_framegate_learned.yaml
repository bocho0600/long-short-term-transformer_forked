DATA:
  DATA_NAME: 'THUMOS'
INPUT:
  MODALITY: 'twostream'
  VISUAL_FEATURE: 'rgb_kinetics_resnet50'
  MOTION_FEATURE: 'flow_kinetics_bninception'
MODEL:
  MODEL_NAME: 'LSTR'
  FEATURE_HEAD:
    LINEAR_ENABLED: True
    LINEAR_OUT_FEATURES: 1024
  LSTR:
    NUM_HEADS: 16
    DIM_FEEDFORWARD: 1024
    DROPOUT: 0.2
    ACTIVATION: 'relu'
    LONG_MEMORY_SECONDS: 2048
    LONG_MEMORY_SAMPLE_RATE: 4     # -> LONG_MEMORY_NUM_SAMPLES = 2048 frames
    WORK_MEMORY_SECONDS: 8
    WORK_MEMORY_SAMPLE_RATE: 1
    ENC_MODULE: [
      [16, 1, True], [32, 2, True]
    ]
    DEC_MODULE: [-1, 2, True]
    # Learned pre-embedding frame gate: a tiny Linear(raw->1) scores each raw
    # frame; the top-k are embedded (cheap early pruning). Trained end-to-end via
    # a soft sigmoid gate on the kept frames (hard top-k is non-differentiable).
    # NEEDS its own training run -- the scorer has weights, so it is NOT
    # compatible with a plain baseline checkpoint. Train and test with this config.
    FRAME_GATE:
      ENABLED: True
      TOP_K: 512                   # keep 512 / 2048; sweep e.g. {256, 512, 1024}
      SCORE: 'learned'
  CRITERIONS: [['MCE', {}]]
DATA_LOADER:
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  PIN_MEMORY: True
SOLVER:
  NUM_EPOCHS: 25
  OPTIMIZER: 'adam'
  BASE_LR: 7e-05
  WEIGHT_DECAY: 5e-05
  SCHEDULER:
    SCHEDULER_NAME: 'warmup_cosine'
    WARMUP_FACTOR: 0.3
    WARMUP_EPOCHS: 10.0
    WARMUP_METHOD: 'linear'
